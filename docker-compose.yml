services:
  # Auth Service Database
  auth-postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./auth-service/migrations:/docker-entrypoint-initdb.d:ro
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Books Service Database
  books-postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: books
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - ./books-service/migrations:/docker-entrypoint-initdb.d:ro
      - books_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
      target: production
    ports:
      - "8081:8081"
      - "2346:2346"
    environment:
      - port=8081
      - DATABASE_URL=postgres://postgres:postgres@auth-postgres:5432/auth?sslmode=disable
    depends_on:
      auth-postgres:
        condition: service_healthy

  books-service:
    build:
      context: ./books-service
      dockerfile: Dockerfile
      target: production
    ports:
      - "8082:8082"
      - "2345:2345"
    environment:
      - PORT=8082
      - DATABASE_URL=postgres://postgres:postgres@books-postgres:5432/books?sslmode=disable
      - AUTH_SERVICE_URL=http://auth-service:8081
    depends_on:
      books-postgres:
        condition: service_healthy
      auth-service:
        condition: service_started

  # Frontend Application
  frontend:
    build: ./frontend
    ports:
      - "5174:80"
    depends_on:
      auth-service:
        condition: service_started
      books-service:
        condition: service_started

volumes:
  auth_postgres_data:
  books_postgres_data:
